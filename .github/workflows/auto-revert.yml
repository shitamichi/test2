# ============================================================================
# 【このファイルは何？】
#   GitHub Actions の設定ファイル。
#   main / develop 関連で Unitテストが失敗したとき、警告コメントを自動投稿する。
#     ・main / develop への「直push」で失敗 → そのコミットにコミットコメント
#     ・main / develop 宛の「PR」で失敗     → そのPRにコメント
#
# 【通知だけを行い、コードには一切触れない】
#   ブランチ作成・コミット・切り戻し（revert）・force push はいっさい行わない。
#   テストが不安定（flaky）で落ちただけの可能性もあり、前進修正（fix commit）と
#   切り戻しのどちらが適切かは状況によるため、判断は必ず人に委ねる。
#   このワークフローの責務は「失敗が見落とされないようにすること」だけ。
#
# 【Unitテストの失敗に限定している】
#   Tests ワークフローは composer install の失敗やランナー障害でも赤くなる。
#   それらで警告するのは誤りなので、失敗したステップ名が
#   "Run Unit tests" のときだけ動くようAPIで判定している。
#   （Pint は continue-on-error なので、そもそも赤の原因にならない）
#
# 【この仕組みは「保険」であって本命ではない】
#   本命はブランチ保護（Settings → Rules）で
#     ・Require a pull request before merging
#     ・Require status checks to pass → phpunit
#   を有効にし、壊れたコードが main に入らないようにすること。
#   このワークフローは、その後追い・補助。
#
# 【関連ファイル】
#   tests.yml   : Pint + PHPUnit（このワークフローの起動元）
#   summary.yml : 差分のAI要約
#   claude.yml  : @claude メンション対応
# ============================================================================

# ワークフローの表示名。GitHubの「Actions」タブにこの名前で一覧表示される。
name: Unit Test Failure Notice

# 【いつ動かすか】
#   workflow_run : 別のワークフロー（ここでは Tests）の完了を合図に起動する。
#
#   ※ workflow_run は「既定ブランチ(main)にあるこのファイルの内容」で動く。
#     作業ブランチ上で編集しても、mainにマージするまで反映されない。
#
#   ※ branches フィルタは使わない。
#     このフィルタが見るのは起動元の head_branch。
#     PR起動時の head_branch は PR元ブランチ（feat/xxx 等）になるため、
#     main / develop で絞るとPRが丸ごと対象外になってしまう。
#     対象ブランチの判定は後段の "Resolve target" ステップで行う。
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

# 【権限】
#   contents: write       … コミットコメントの投稿に必要（push時）
#   pull-requests: write  … PRへのコメント投稿に必要（PR時）
#   actions: read         … どのステップが失敗したかをAPIで調べるため
#
#   ※ ブランチ作成やpushは行わないが、コミットコメントのAPIが
#     contents スコープの write を要求するため contents: write は残している。
permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest

    # 【起動条件】ここで大半のケースを足切りする。
    #   conclusion == 'failure' : Tests が赤で終わったときだけ
    #   event                   : 直push と PR の両方を受ける。
    #                             扱いは同じで、投稿先だけが異なる。
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'pull_request')

    steps:
      # 【判定】失敗したのが本当に Unitテストのステップかを確認する。
      #   起動元ワークフローの各ステップの結果をGitHub REST APIで取得し、
      #   "Run Unit tests" が failure かどうかを見る。
      #   composer install の失敗やランナー障害では何もしない。
      #
      #   ※ gh run view --json jobs ではなく gh api を使うのは、
      #     REST APIのほうがレスポンスの形が公式に定義されていて安定だから。
      #       { total_count, jobs: [ { name, status, conclusion,
      #           steps: [ { name, status, conclusion, number } ] } ] }
      - name: Check whether the Unit test step failed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # per_page=100 で1ページに収める（Tests のジョブは phpunit の1つだけ）
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json

          # 失敗したステップ名の一覧（ログとジョブサマリ表示に使う）
          FAILED="$(jq -r '[.jobs[].steps[]? | select(.conclusion == "failure") | .name] | join(", ")' jobs.json)"
          echo "失敗したステップ: ${FAILED:-なし}"
          echo "failed_steps=${FAILED}" >> "$GITHUB_OUTPUT"

          if jq -e '[.jobs[].steps[]? | select(.name == "Run Unit tests" and .conclusion == "failure")] | length > 0' jobs.json > /dev/null; then
            echo "unit_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "unit_failed=false" >> "$GITHUB_OUTPUT"
            echo "Unitテスト以外の失敗のため、コメントは行わない。"
          fi

      # 【対象の特定】push か PR かを判定し、対象外ならここで打ち切る。
      #   mode     : push … main / develop への直push（→ コミットコメント）
      #              pr   … main / develop 宛のPR（→ PRコメント）
      #   in_scope : この仕組みの対象かどうか（false なら以降はスキップ）
      #
      #   PR番号の取得を2段構えにしているのは、workflow_run のペイロードに入る
      #   pull_requests 配列が「同一リポジトリ内のPR」でしか埋まらないため。
      #   forkからのPRでは空になるので、head_sha から引き直している。
      - name: Resolve target (push / pull request)
        id: target
        if: steps.check.outputs.unit_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_PAYLOAD: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          # --- 直push の場合: 押されたブランチがそのまま対象 ---
          if [ "$EVENT" = "push" ]; then
            echo "mode=push"           >> "$GITHUB_OUTPUT"
            echo "target=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
            case "$HEAD_BRANCH" in
              main|develop)
                echo "in_scope=true"  >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "in_scope=false" >> "$GITHUB_OUTPUT"
                echo "対象外ブランチへの直pushのため何もしない: $HEAD_BRANCH"
                ;;
            esac
            exit 0
          fi

          # --- PR の場合: マージ先（base）が対象かどうかで判定する ---
          echo "mode=pr" >> "$GITHUB_OUTPUT"

          # まずはペイロードから取得（APIを叩かずに済む場合が多い）
          PR_NUMBER="$(printf '%s' "$PR_PAYLOAD" | jq -r 'first(.[]?.number) // empty')"

          # forkからのPR等でペイロードが空なら、コミットに紐づくPRを引き直す
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
              --jq 'first(.[] | select(.state == "open") | .number) // empty' || true)"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "in_scope=false" >> "$GITHUB_OUTPUT"
            echo "対応するPRを特定できなかったため何もしない (sha: $HEAD_SHA)"
            exit 0
          fi

          BASE_REF="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.base.ref')"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "target=$BASE_REF"     >> "$GITHUB_OUTPUT"

          case "$BASE_REF" in
            main|develop)
              echo "in_scope=true"  >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "in_scope=false" >> "$GITHUB_OUTPUT"
              echo "PRのマージ先が対象外のため何もしない: $BASE_REF"
              ;;
          esac

      # 【警告コメントの投稿】push / PR で投稿先だけを切り替える。
      #   ・履歴にもブランチにも一切触れない
      #   ・同じコミットへの二重投稿は、本文に埋めた目印(MARKER)で防ぐ
      #
      #   status の意味（ジョブサマリ表示に使う）
      #     commented        : コメントを投稿した
      #     skipped_existing : 同じコミットのコメントが既にある
      - name: Post warning comment
        id: comment
        if: >-
          steps.check.outputs.unit_failed == 'true' &&
          steps.target.outputs.in_scope == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.target.outputs.mode }}
          TARGET: ${{ steps.target.outputs.target }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SUBJECT: ${{ github.event.workflow_run.head_commit.message }}
          FAILED_STEPS: ${{ steps.check.outputs.failed_steps }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          SHORT="${HEAD_SHA:0:7}"
          # コミットメッセージは複数行ありうるので1行目だけ使う
          SUBJECT_LINE="$(printf '%s' "$SUBJECT" | head -n 1)"

          # HTMLコメントなので画面には出ない。重複投稿の判定にだけ使う目印。
          MARKER="<!-- unit-test-failed:${HEAD_SHA} -->"

          # 既存コメントの取得先（PRはissueコメント、pushはコミットコメント）
          if [ "$MODE" = "pr" ]; then
            LIST_API="repos/$REPO/issues/$PR_NUMBER/comments"
          else
            LIST_API="repos/$REPO/commits/$HEAD_SHA/comments"
          fi

          if gh api "$LIST_API?per_page=100" --paginate --jq '.[].body' | grep -qF "$MARKER"; then
            echo "既に $SHORT についてコメント済みのため投稿しない"
            echo "status=skipped_existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 本文はファイルに書き出して渡す（シェルの引用崩れを避けるため）
          {
            echo "$MARKER"

            if [ "$MODE" = "pr" ]; then
              echo "## ⚠️ Unitテストが失敗しています"
              echo
              echo "\`$SHORT\` の時点で **Unitテストが失敗**しました。**マージ前に修正してください。**"
            else
              echo "## 🚨 \`$TARGET\` でUnitテストが失敗しています"
              echo
              echo "\`$TARGET\` への直pushで **Unitテストが失敗**しました。**早急に対応してください。**"
            fi

            echo
            echo "| 項目 | 内容 |"
            echo "|---|---|"
            echo "| 対象コミット | \`$SHORT\` $SUBJECT_LINE |"
            echo "| ブランチ | \`$HEAD_BRANCH\` |"
            echo "| 失敗したステップ | ${FAILED_STEPS:-（取得できず）} |"
            echo "| 失敗したCI | [Tests の実行結果]($RUN_URL) |"
            echo
            echo "### 自動の切り戻しは行いません"

            if [ "$MODE" = "pr" ]; then
              echo "このPRは未マージのため、マージしなければ \`main\` / \`develop\` は壊れません。"
            else
              echo "このワークフローはコードに一切触れません（ブランチ作成・revert・force push なし）。"
            fi

            echo "前進修正（fix commit）と切り戻しのどちらが適切かは、担当者の判断に委ねます。"
            echo "テストが不安定（flaky）で落ちただけでないかも併せて確認してください。"
            echo
            echo "このコミットを打ち消す場合の手順:"
            echo
            echo '```bash'
            echo "git switch $HEAD_BRANCH && git pull"
            echo "git switch -c revert/$SHORT"
            echo "git revert $SHORT"
            echo "git push -u origin revert/$SHORT   # PRを作成してレビューを受ける"
            echo '```'
            echo
            echo "---"
            echo "*このコメントは auto-revert.yml により自動生成されました。*"
          } > "$RUNNER_TEMP/comment.md"

          if [ "$MODE" = "pr" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
            echo "コメントを投稿した: PR #$PR_NUMBER"
          else
            # コミットコメントAPIはJSONで渡す。--rawfile なら改行や引用符も安全。
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' > "$RUNNER_TEMP/payload.json"
            gh api "repos/$REPO/commits/$HEAD_SHA/comments" \
              --input "$RUNNER_TEMP/payload.json" --jq '.html_url'
            echo "コメントを投稿した: commit $SHORT"
          fi

          echo "status=commented" >> "$GITHUB_OUTPUT"

      # 【結果の通知】何をした／しなかったのかをジョブサマリに残す。
      #   if: always() … 途中で止まった場合も理由を表示するため必ず実行する。
      - name: Publish result
        if: always()
        env:
          UNIT_FAILED: ${{ steps.check.outputs.unit_failed }}
          FAILED_STEPS: ${{ steps.check.outputs.failed_steps }}
          MODE: ${{ steps.target.outputs.mode }}
          IN_SCOPE: ${{ steps.target.outputs.in_scope }}
          TARGET: ${{ steps.target.outputs.target }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          COMMENT_STATUS: ${{ steps.comment.outputs.status }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo "## 🔔 Unitテスト失敗通知の判定結果"
            echo
            echo "- 起動元: [Tests の実行結果]($RUN_URL)"
            echo "- 失敗したステップ: ${FAILED_STEPS:-（取得できず）}"
            echo "- 種別: ${MODE:-（判定前）} / 対象ブランチ: ${TARGET:-（判定前）}"
            echo

            if [ "$UNIT_FAILED" != "true" ]; then
              echo "**何もしませんでした。**"
              echo
              echo "Unitテスト以外の失敗（composer install の失敗、ランナー障害など）は"
              echo "コードの問題とは限らないため、対象外としています。"
            elif [ "${IN_SCOPE:-}" != "true" ]; then
              echo "**何もしませんでした**（main / develop に関係しない実行のため）。"
            else
              case "${COMMENT_STATUS:-}" in
                commented)
                  if [ "${MODE:-}" = "pr" ]; then
                    echo "**PR #${PR_NUMBER} に警告コメントを投稿しました。**"
                  else
                    echo "**コミット \`${HEAD_SHA:0:7}\` に警告コメントを投稿しました。**"
                  fi
                  echo
                  echo "> 自動の切り戻しは行いません。対応方針は担当者が判断してください。"
                  ;;
                skipped_existing)
                  echo "**何もしませんでした**（同じコミットのコメントが既にあるため）。"
                  ;;
                *)
                  echo "**判定できませんでした。** 上のステップのログを確認してください。"
                  ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"
